name: Update README

on:
  schedule:
    - cron: "0 9 15 4 *" # 15 avril à 9h UTC (heure de naissance)
  workflow_dispatch: # déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install fastfetch
        run: |
          curl -Lo fastfetch.deb https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb
          sudo dpkg -i fastfetch.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      - name: Generate tape + README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python generate_readme.py

      - name: Run VHS
        uses: charmbracelet/vhs-action@v2
        with:
          path: fastfetch.tape

      - name: Move GIF to assets
        run: |
          mkdir -p assets
          mv fastfetch.gif assets/fastfetch.gif

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/fastfetch.gif
          git diff --cached --quiet || git commit -m "chore: update README & fastfetch GIF"
          git push
