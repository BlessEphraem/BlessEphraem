name: Update README

on:
  schedule:
    - cron: "0 9 15 4 *" # 15 avril à 9h UTC (heure de naissance)
  workflow_dispatch: # déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install VHS + dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y vhs

      - name: Install JetBrainsMono Nerd Font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -Lo font.zip https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
          unzip -q font.zip -d ~/.local/share/fonts
          fc-cache -fv

      - name: Install fastfetch
        run: |
          curl -Lo fastfetch.deb https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb
          sudo dpkg -i fastfetch.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      - name: Generate tape + README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python generate_readme.py

      - name: Run VHS
        run: vhs fastfetch.tape

      - name: Move GIF to assets
        run: |
          mkdir -p assets
          mv fastfetch.gif assets/fastfetch.gif

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/fastfetch.gif
          git diff --cached --quiet || git commit -m "chore: update README & fastfetch GIF"
          git push
